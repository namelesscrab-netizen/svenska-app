<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svenska Studier – Komplett Kortlek</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-gold: #facc15;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      color: var(--accent);
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 650px;
      margin-bottom: 20px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    /* Flashcard Container */
    .card-scene {
      width: 100%;
      max-width: 550px;
      height: 320px;
      perspective: 1000px;
      margin-bottom: 16px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
      cursor: pointer;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid #334155;
      background: var(--card-bg);
    }

    .card-face-back {
      transform: rotateY(180deg);
      background: #182234;
      border-color: #3b82f6;
    }

    .card-tag {
      position: absolute;
      top: 16px;
      left: 18px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-chapter {
      position: absolute;
      top: 16px;
      right: 18px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-main {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .card-sub {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-example {
      margin-top: 16px;
      font-size: 14px;
      font-style: italic;
      color: #93c5fd;
    }

    .hint-text {
      position: absolute;
      bottom: 14px;
      font-size: 12px;
      color: #64748b;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text);
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #334155;
    }

    .counter {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      min-width: 60px;
      text-align: center;
    }
  </style>
  <script src="vocab.js"></script>
</head>
<body>

  <header>
    <h1>Complete Swedish Study Deck</h1>
    <div style="font-size: 14px; color: var(--text-muted);">Chapters 1–4 + Duolingo Master Vocabulary</div>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setDeck('all', this)">All Cards</button>
    <button class="filter-btn" onclick="setDeck('c1', this)">Kap 1: Hej</button>
    <button class="filter-btn" onclick="setDeck('c2', this)">Kap 2: Släkt</button>
    <button class="filter-btn" onclick="setDeck('c3', this)">Kap 3: Fika</button>
    <button class="filter-btn" onclick="setDeck('c4', this)">Kap 4: Fritid</button>
    <button class="filter-btn" onclick="setDeck('Grammatik', this)">Grammatik</button>
  </div>

  <div class="card-scene" onclick="flipCard()">
    <div class="card" id="study-card">
      <!-- Front -->
      <div class="card-face">
        <span class="card-tag" id="tag-front">Tag</span>
        <span class="card-chapter" id="chap-front">Kapitel 1</span>
        <div class="card-main" id="word-front">Laddar...</div>
        <div class="hint-text">Click anywhere to reveal details</div>
      </div>
      <!-- Back -->
      <div class="card-face card-face-back">
        <span class="card-tag" id="tag-back">Betydelse</span>
        <div class="card-sub" id="word-back">Loading...</div>
        <div class="card-example" id="example-back"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" onclick="prevCard(event)">← Previous</button>
    <button class="nav-btn" onclick="speakSwedish(event)">🔊 Listen</button>
    <span class="counter" id="card-counter">1 / 1</span>
    <button class="nav-btn" onclick="nextCard(event)">Next →</button>
  </div>

  <script>
    const allCards = (typeof MASTER_VOCAB !== 'undefined') ? MASTER_VOCAB : [];
    let currentCards = [...allCards];
    let currentIndex = 0;

    const cardEl = document.getElementById('study-card');

    function setDeck(filter, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (filter === 'all') {
        currentCards = [...allCards];
      } else if (filter === 'c1') {
        currentCards = allCards.filter(c => c.chapter === 1);
      } else if (filter === 'c2') {
        currentCards = allCards.filter(c => c.chapter === 2);
      } else if (filter === 'c3') {
        currentCards = allCards.filter(c => c.chapter === 3);
      } else if (filter === 'c4') {
        currentCards = allCards.filter(c => c.chapter === 4);
      } else {
        currentCards = allCards.filter(c => c.category === filter);
      }

      currentIndex = 0;
      cardEl.classList.remove('is-flipped');
      renderCard();
    }

    function renderCard() {
      if (currentCards.length === 0) {
        document.getElementById('word-front').innerText = "No cards found";
        document.getElementById('word-back').innerText = "";
        document.getElementById('card-counter').innerText = "0 / 0";
        return;
      }

      const item = currentCards[currentIndex];
      document.getElementById('tag-front').innerText = item.category || item.tag || 'Ordförråd';
      document.getElementById('chap-front').innerText = `Kapitel ${item.chapter || 1}`;
      document.getElementById('word-front').innerHTML = item.adultFront || item.target;
      
      document.getElementById('word-back').innerHTML = item.adultBack || item.translation;
      document.getElementById('example-back').innerHTML = item.adultExample || (item.phrase ? `Ex: ${item.phrase}` : '');
      document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${currentCards.length}`;
    }

    function flipCard() {
      cardEl.classList.toggle('is-flipped');
    }

    function nextCard(e) {
      if (e) e.stopPropagation();
      cardEl.classList.remove('is-flipped');
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % currentCards.length;
        renderCard();
      }, 150);
    }

    function prevCard(e) {
      if (e) e.stopPropagation();
      cardEl.classList.remove('is-flipped');
      setTimeout(() => {
        currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
        renderCard();
      }, 150);
    }

    function speakSwedish(e) {
      if (e) e.stopPropagation();
      if (currentCards.length === 0) return;
      const item = currentCards[currentIndex];
      const text = item.speak || item.target;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'sv-SE';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Keyboard navigation (Left, Right, Space)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        flipCard();
      } else if (e.code === 'ArrowRight') {
        nextCard();
      } else if (e.code === 'ArrowLeft') {
        prevCard();
      }
    });

    window.onload = renderCard;
  </script>
</body>
</html>
