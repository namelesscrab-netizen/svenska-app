<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svenska för Charli & Cooper</title>
  <style>
    :root {
      --bg-color: #fff9e6;
      --card-bg: #ffffff;
      --border-color: #ffd166;
      --accent-blue: #005293;
      --accent-yellow: #fecb00;
      --btn-green: #06d6a0;
      --btn-purple: #9d4edd;
      --text-main: #2b2d42;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 650px;
      margin-bottom: 10px;
    }

    .flag {
      font-size: 32px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: var(--accent-blue);
      text-align: center;
    }

    /* Chapter & Category Filter Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      max-width: 650px;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: thin;
    }

    .filter-chip {
      background: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      color: var(--accent-blue);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    .card-container {
      background: var(--card-bg);
      border: 6px solid var(--border-color);
      border-radius: 28px;
      width: 100%;
      max-width: 650px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      position: relative;
    }

    .phrase-box {
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .phrase-sv {
      font-size: 26px;
      font-weight: bold;
      color: #e63946;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .phrase-en {
      font-size: 18px;
      color: #4a5568;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 14px;
    }

    /* Scalable Icon Box */
    .icon-frame {
      width: 170px;
      height: 170px;
      border-radius: 24px;
      background: #f8fafc;
      border: 4px dashed #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 78px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
    }

    .word-box {
      text-align: center;
      margin-bottom: 16px;
    }

    .word-sv {
      font-size: 32px;
      font-weight: 900;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .audio-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 26px;
      line-height: 1;
      padding: 4px;
      transition: transform 0.1s;
    }

    .audio-btn:active {
      transform: scale(1.2);
    }

    .action-row {
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
      margin-bottom: 16px;
    }

    .btn {
      flex: 1;
      max-width: 180px;
      padding: 12px 16px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(3px);
    }

    .btn-read {
      background-color: var(--btn-purple);
    }

    .btn-write {
      background-color: var(--btn-green);
    }

    .trace-container {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      background: #fff;
      border-radius: 16px;
      padding: 10px;
      border: 2px solid #e9ecef;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 120px;
      border: 2px dashed #ced4da;
      border-radius: 12px;
      background: #fdfdfd;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .canvas-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      font-weight: bold;
      color: rgba(0,0,0,0.12);
      pointer-events: none;
      letter-spacing: 2px;
      width: 100%;
      text-align: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .trace-controls {
      display: flex;
      gap: 10px;
    }

    .small-btn {
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: #e9ecef;
      color: #495057;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 650px;
      margin-top: 14px;
    }

    .nav-btn {
      background: #ffffff;
      border: 3px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: var(--accent-blue);
    }

    .counter-text {
      font-size: 15px;
      font-weight: bold;
      color: #64748b;
    }
  </style>
  <script src="vocab.js"></script>
</head>
<body>

  <header>
    <div class="flag">🇸🇪</div>
    <h1 id="app-title">Charli & Cooper i Sverige</h1>
    <div class="flag">🇸🇪</div>
  </header>

  <!-- Interactive Chapter & Topic Filter Bar -->
  <div class="filter-bar">
    <button class="filter-chip active" onclick="setFilter('all', this)">⭐ Alla kort</button>
    <button class="filter-chip" onclick="setFilter('c1', this)">Kapitel 1</button>
    <button class="filter-chip" onclick="setFilter('c2', this)">Kapitel 2</button>
    <button class="filter-chip" onclick="setFilter('c3', this)">Kapitel 3</button>
    <button class="filter-chip" onclick="setFilter('c4', this)">Kapitel 4</button>
    <button class="filter-chip" onclick="setFilter('Fritid', this)">⚽ Fritid</button>
    <button class="filter-chip" onclick="setFilter('Mataffär', this)">🛒 Mataffär</button>
    <button class="filter-chip" onclick="setFilter('Mat & Fika', this)">🥐 Fika</button>
    <button class="filter-chip" onclick="setFilter('Familj', this)">👨‍👩‍👧 Familj</button>
    <button class="filter-chip" onclick="setFilter('Djur', this)">🐶 Djur</button>
    <button class="filter-chip" onclick="setFilter('Nummer', this)">🔢 Siffror</button>
  </div>

  <div class="card-container">
    <div class="phrase-box">
      <!-- Swedish Phrase + Swedish Audio Button -->
      <div class="phrase-sv">
        <span id="phrase-text">Laddar...</span>
        <button class="audio-btn" title="Lyssna på svenska" onclick="playCurrentAudio('phrase')">🔊</button>
      </div>

      <!-- English Translation + English Audio Button -->
      <div class="phrase-en">
        <span id="translation-text">Loading...</span>
        <button class="audio-btn" style="font-size: 20px;" title="Listen in English" onclick="playEnglishAudio()">🗣️</button>
      </div>
    </div>

    <!-- Scalable Visual Icon Frame -->
    <div class="icon-frame" id="card-icon">🥐</div>

    <div class="word-box">
      <div class="word-sv">
        <span id="target-word">Laddar</span>
        <button class="audio-btn" title="Lyssna på ordet" onclick="playCurrentAudio('word')">🔊</button>
      </div>
    </div>

    <div class="action-row">
      <!-- Reads Swedish first, then automatically translates in English -->
      <button class="btn btn-read" onclick="playBilingualAudio()">💬 LÄS</button>
      <button class="btn btn-write" onclick="toggleTracing()">✏️ SKRIV</button>
    </div>

    <div class="trace-container" id="trace-box">
      <div class="canvas-wrapper">
        <div class="canvas-guide" id="canvas-guide-text">ord</div>
        <canvas id="paint-canvas"></canvas>
      </div>
      <div class="trace-controls">
        <button class="small-btn" onclick="clearCanvas()">Rensa (Clear)</button>
        <button class="small-btn" style="background: #06d6a0; color: white;" onclick="sparkleCelebrate()">Klar! ⭐</button>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" onclick="prevCard()">⬅ Föregående</button>
    <span class="counter-text" id="card-counter">1 / 1</span>
    <button class="nav-btn" onclick="nextCard()">Nästa ➡</button>
  </div>

  <script>
    // Grab all kid-friendly cards from vocab.js
    const allKidCards = (typeof MASTER_VOCAB !== 'undefined')
      ? MASTER_VOCAB.filter(item => item.kidFriendly)
      : [];

    let currentDeck = [...allKidCards];
    let currentIndex = 0;

    const canvas = document.getElementById('paint-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function setFilter(filterType, buttonEl) {
      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
      if (buttonEl) buttonEl.classList.add('active');

      if (filterType === 'all') {
        currentDeck = [...allKidCards];
      } else if (filterType === 'c1') {
        currentDeck = allKidCards.filter(c => c.chapter === 1);
      } else if (filterType === 'c2') {
        currentDeck = allKidCards.filter(c => c.chapter === 2);
      } else if (filterType === 'c3') {
        currentDeck = allKidCards.filter(c => c.chapter === 3);
      } else if (filterType === 'c4') {
        currentDeck = allKidCards.filter(c => c.chapter === 4);
      } else {
        currentDeck = allKidCards.filter(c => c.category === filterType);
      }

      currentIndex = 0;
      renderCard();
    }

    function renderCard() {
      if (currentDeck.length === 0) {
        document.getElementById('phrase-text').innerText = "Inga kort hittades";
        document.getElementById('translation-text').innerText = "No cards found";
        document.getElementById('target-word').innerText = "";
        document.getElementById('card-icon').innerText = "❓";
        document.getElementById('card-counter').innerText = "0 / 0";
        return;
      }

      const card = currentDeck[currentIndex];
      document.getElementById('phrase-text').innerText = card.phrase;
      document.getElementById('translation-text').innerText = card.translation;
      document.getElementById('target-word').innerText = card.target;
      document.getElementById('card-icon').innerText = card.icon || "⭐";
      document.getElementById('canvas-guide-text').innerText = card.target.replace('en ', '').replace('ett ', '').replace('att ', '');
      document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${currentDeck.length}`;
      clearCanvas();
    }

    // Swedish audio playback
    function playCurrentAudio(type) {
      if (currentDeck.length === 0) return;
      const card = currentDeck[currentIndex];
      const audioPath = type === 'phrase' ? card.audioPhrase : card.audio;
      const spokenText = type === 'phrase' ? (card.speakPhrase || card.phrase) : (card.speak || card.target);

      const audio = new Audio(audioPath);
      audio.play().catch(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(spokenText);
          utterance.lang = 'sv-SE';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      });
    }

    // English audio playback for Charli
    function playEnglishAudio() {
      if (currentDeck.length === 0) return;
      const card = currentDeck[currentIndex];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(card.translation);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Reads Swedish first, then automatically reads English
    function playBilingualAudio() {
      if (currentDeck.length === 0) return;
      const card = currentDeck[currentIndex];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const svUtterance = new SpeechSynthesisUtterance(card.speakPhrase || card.phrase);
        svUtterance.lang = 'sv-SE';
        svUtterance.rate = 0.85;

        const enUtterance = new SpeechSynthesisUtterance(card.translation);
        enUtterance.lang = 'en-US';
        enUtterance.rate = 0.9;

        svUtterance.onend = () => {
          setTimeout(() => {
            window.speechSynthesis.speak(enUtterance);
          }, 350);
        };

        window.speechSynthesis.speak(svUtterance);
      }
    }

    function toggleTracing() {
      const box = document.getElementById('trace-box');
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
      if (box.style.display === 'flex') {
        resizeCanvas();
      }
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#06d6a0';
    }

    function startDraw(e) {
      isDrawing = true;
      draw(e);
    }

    function stopDraw() {
      isDrawing = false;
      ctx.beginPath();
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    window.addEventListener('touchend', stopDraw);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
    }

    function sparkleCelebrate() {
      playCurrentAudio('word');
      alert("Bra jobbat! (Great job!) ⭐🎉");
    }

    function nextCard() {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex + 1) % currentDeck.length;
      renderCard();
    }

    function prevCard() {
      if (currentDeck.length === 0) return;
      currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
      renderCard();
    }

    window.onload = renderCard;
  </script>
</body>
</html>
